
<app-auth-card subtitle="Forgot your password? Don’t worry — we’ll help you recover your account.">
    <form [formGroup]="forgotForm" (ngSubmit)="onForgot()">
        <!-- Email -->
        <div class="mb-2">
            <label for="email" class="form-label fw-semibold mb-1">Email</label>
            <div class="position-relative">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input pInputText type="email" id="email" formControlName="email" class="form-control" placeholder="Enter your email"
                    [class.is-valid]="email.valid && (email.dirty || email.touched)"
                    [class.is-invalid]="email.invalid && (email.dirty || email.touched)"
                />
            </div>
            <!-- Email Validation -->
            @if(email.invalid && (email.dirty || email.touched)){
                <div class="invalid-feedback">
                    @if (email.errors?.['required']) {
                        <p>Email is required.</p>
                    }@else if (email.errors?.['pattern']) {
                       <p>Please enter a valid email format.</p>
                    }  
                </div>
            }
        </div>
    
        <!-- Submit Button -->
        <div class="d-grid mt-3 w-50 m-auto">
            <button type="submit" class="btn btn-md" [disabled]="forgotForm.invalid">
                Send Reset Link
            </button>
        </div>
    
        <!-- Login -->
        <div class="auth-link text-center mt-2">
            <a routerLink="/auth/login">Back to Login</a>
        </div>
    </form>
</app-auth-card>
